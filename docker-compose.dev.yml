version: "3.8"

services:
  mongodb:
    image: mongo:8.0
    container_name: examninja-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword123
      MONGO_INITDB_DATABASE: examninja_dev
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - examninja-dev-network

  mongo-express:
    image: mongo-express:latest
    container_name: examninja-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpassword123
      ME_CONFIG_MONGODB_URL: mongodb://admin:devpassword123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - examninja-dev-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: examninja-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:devpassword123@mongodb:27017/examninja_dev?authSource=admin
      JWT_SECRET: dev_jwt_secret_not_for_production
      JWT_EXPIRE: 7d
      SESSION_SECRET: dev_session_secret
      CLIENT_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MAX_FILE_SIZE: 10485760
    volumes:
      - ./server/src:/app/src:delegated
      - ./server/package.json:/app/package.json
      - ./server/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - examninja-dev-network
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: examninja-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      NODE_ENV: development
    volumes:
      - ./client/src:/app/src:delegated
      - ./client/components:/app/components:delegated
      - ./client/services:/app/services:delegated
      - ./client/hooks:/app/hooks:delegated
      - ./client/context:/app/context:delegated
      - ./client/constants:/app/constants:delegated
      - ./client/types.ts:/app/types.ts
      - ./client/App.tsx:/app/App.tsx
      - ./client/index.tsx:/app/index.tsx
      - ./client/index.html:/app/index.html
      - ./client/package.json:/app/package.json
      - ./client/tsconfig.json:/app/tsconfig.json
      - ./client/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - examninja-dev-network
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongodb_dev_data:
    driver: local

networks:
  examninja-dev-network:
    driver: bridge
