version: "3.8"

services:
  mongodb:
    image: mongo:8.0
    container_name: examninja-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: examninja_secure_password_2025
      MONGO_INITDB_DATABASE: examninja
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./server/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - examninja-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ============================================================
  # MONGO EXPRESS - Веб-інтерфейс для MongoDB (опціонально)
  # ============================================================
  mongo-express:
    image: mongo-express:latest
    container_name: examninja-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: examninja_secure_password_2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:examninja_secure_password_2025@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - examninja-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: examninja-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:examninja_secure_password_2025@mongodb:27017/examninja?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_in_production_2025
      JWT_EXPIRE: 7d
      SESSION_SECRET: your_session_secret_change_in_production_2025
      CLIENT_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ./server/google_api_key.json:/app/google_api_key.json:ro
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - examninja-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: examninja-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - examninja-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5173 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
    driver: local
    name: examninja_mongodb_data

  mongodb_config:
    driver: local
    name: examninja_mongodb_config

  uploads_data:
    driver: local
    name: examninja_uploads

  backend_logs:
    driver: local
    name: examninja_backend_logs

networks:
  examninja-network:
    driver: bridge
    name: examninja_network
