# Docker Compose конфігурація для ExamNinja
# Версія: 1.0
# Дата: 27 грудня 2025

version: "3.8"

services:
  # ============================================================
  # MONGODB - База даних
  # ============================================================
  mongodb:
    image: mongo:8.0
    container_name: examninja-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: examninja_secure_password_2025
      MONGO_INITDB_DATABASE: examninja
    volumes:
      # Персистентне зберігання даних
      - mongodb_data:/data/db
      # Конфігурація MongoDB
      - mongodb_config:/data/configdb
      # Ініціалізаційні скрипти (якщо потрібно)
      - ./server/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - examninja-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ============================================================
  # MONGO EXPRESS - Веб-інтерфейс для MongoDB (опціонально)
  # ============================================================
  mongo-express:
    image: mongo-express:latest
    container_name: examninja-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: examninja_secure_password_2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:examninja_secure_password_2025@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - examninja-network

  # ============================================================
  # BACKEND API - Node.js + Express + TypeScript
  # ============================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: examninja-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Node
      NODE_ENV: production
      PORT: 5000

      # MongoDB
      MONGODB_URI: mongodb://admin:examninja_secure_password_2025@mongodb:27017/examninja?authSource=admin

      # JWT
      JWT_SECRET: your_super_secret_jwt_key_change_in_production_2025
      JWT_EXPIRE: 7d

      # Session
      SESSION_SECRET: your_session_secret_change_in_production_2025

      # CORS
      CLIENT_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173

      # Google OAuth (якщо використовується)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback

      # AI API Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # File Upload
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: /app/uploads

    volumes:
      # Завантажені файли
      - uploads_data:/app/uploads
      # Google credentials (якщо потрібно)
      - ./server/google_api_key.json:/app/google_api_key.json:ro
      # Логи
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - examninja-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # FRONTEND - React + Vite
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: examninja-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # API URL
      VITE_API_URL: http://localhost:5000/api

      # Google OAuth
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

      # Environment
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - examninja-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5173 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ============================================================
# VOLUMES - Персистентне зберігання даних
# ============================================================
volumes:
  # База даних MongoDB
  mongodb_data:
    driver: local
    name: examninja_mongodb_data

  # Конфігурація MongoDB
  mongodb_config:
    driver: local
    name: examninja_mongodb_config

  # Завантажені файли користувачів
  uploads_data:
    driver: local
    name: examninja_uploads

  # Логи backend
  backend_logs:
    driver: local
    name: examninja_backend_logs

# ============================================================
# NETWORKS - Ізольована мережа для сервісів
# ============================================================
networks:
  examninja-network:
    driver: bridge
    name: examninja_network
